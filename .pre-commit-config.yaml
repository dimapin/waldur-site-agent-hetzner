repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check .
        pass_filenames: false
        always_run: true
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format check
        entry: uv run ruff format --check .
        pass_filenames: false
        always_run: true
        language: system
        types: [python]
