[project]
name = "waldur-site-agent-hetzner"
version = "0.1.0"
description = "Hetzner Cloud backend for Waldur Site Agent"
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
  "waldur-site-agent==1.0.6rc19",
  "hcloud==2.23.0",
  "pydantic>=2,<3",
]

[dependency-groups]
dev = [
  "pytest>=8,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.13,<0.14",
]

[project.entry-points."waldur_site_agent.backends"]
hetzner = "waldur_site_agent_hetzner.backend:HetznerBackend"

[project.entry-points."waldur_site_agent.backend_settings_schemas"]
hetzner = "waldur_site_agent_hetzner.backend:HetznerBackendSettingsSchema"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["waldur_site_agent_hetzner"]

[tool.pytest.ini_options]
testpaths = ["tests/unit"]
pythonpath = ["."]
markers = ["e2e: tests requiring a live provider"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
